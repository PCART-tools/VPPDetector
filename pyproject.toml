[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vppdetector"
version = "1.1.0"
description = "Detect compatibility risks from variadic argument forwarding in Python library APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "pcresolve>=1.0.8",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=7", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/PCART-tools/VPPDetector"
Repository = "https://github.com/PCART-tools/VPPDetector"
Issues = "https://github.com/PCART-tools/VPPDetector/issues"

[project.scripts]
vppdetector = "vppdetector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vppdetector", "vppdetector.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
